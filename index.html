<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Pomodoro Timer </title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <section id="menu">
            <button onclick="window.open('https://open.spotify.com/intl-es', '_blank');"> <img src="img/spotify.png" height="25" /> </button>
            <button onclick="window.open('https://tasks.google.com/u/1/tasks/', '_blank');"> <img src="img/todolist.png" height="25" /> </button>
            <button onclick="window.open('https://calendar.google.com/calendar/u/1/r', '_blank');"> <img src="img/calendar.png" height="25" /> </button>
            <button> <img src="img/award.png" height="25" /> </button>
        </section>
    </header>
    <section id="app">
        <div id="topbar">
            <h1> Pomodoro Timer </h1>
            <div id="controls">
                <button> <img src="img/night-mode.png" height="25" /> </button>
                <button> <img src="img/chart.png" height="25" /> </button>
                <button> <img src="img/settings.png" height="25" /> </button> <!-- a la dreta i mes avall-->
            </div>
        </div>
        <section id="clock">
            <div id="options">
                <button> Pomodoro </button>
                <button> Short Break </button>
                <button> Long Break </button>
            </div>
            <p id="time"> 25:00 </p>
            <div id="clockControls">
                <button id="startPauseBtn"> &#9654; </button>
                <button type="reset" id="resetBtn"> &#8635; </button>
            </div>
        </section>
    </section>

    <section id="settingsModal" class="ocult">
        <div id="settingsContent">
            <h2>Settings</h2>
            <label for="pomodoroInput">Pomodoro (min)
                <input type="number" id="pomodoroInput" min="1" value="25" />
            </label>
            <label for="shortBreakInput">Short Break (min)
                <input type="number" id="shortBreakInput" min="1" value="5" />
            </label>
            <label for="longBreakInput">Long Break (min)
                <input type="number" id="longBreakInput" min="1" value="15" />
            </label>
            <label for="intervalInput">Long Break every pomodoros
                <input type="number" id="intervalInput" min="1" value="4" />
            </label>
            <div id="settingsButtons">
                <button id="cancelSettings">Cancel</button>
                <button id="saveSettings">Save</button>
            </div>
        </div>
    </section>

    <script src="script.js"> </script>
</body>
</html>
