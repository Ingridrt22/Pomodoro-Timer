<!DOCTYPE html>
<html lang="en">
<head>
    <title> Pomodoro Timer </title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <section id="menu">
            <button onclick="window.open(href='https://open.spotify.com/intl-es', '_blank');"> <img src="img/spotify.png" height="25" /> </button>
            <button onclick="window.open(href='https://tasks.google.com/u/1/tasks/', '_blank');"> <img src="img/todolist.png" height="25" /> </button>
            <button onclick="window.open(href='https://calendar.google.com/calendar/u/1/r', '_blank');"> <img src="img/calendar.png" height="25" /> </button>
            <button> <img src="img/award.png" height="25" /> </button>
        </section>
    </header>
    <section id="app">
        <div id="topbar">
            <h1> Pomodoro Timer </h1>
            <div id="controls">
                <button> <img src="img/night-mode.png" height="25" /> </button>
                <button> <img src="img/chart.png" height="25" /> </button>
                <button> <img src="img/settings.png" height="25" /> </button> <!-- a la dreta i mes avall-->
            </div>
        </div>
        <section id="clock">
            <div id="options">
                <button> Pomodoro </button>
                <button> Short Break </button>
                <button> Long Break </button>
            </div>
            <p id="time"> 25:00 </p>
            <button id="start"> Start </button> <!-- fer mes gran i centrat al mig -->
            <!-- han d'apareixer despres d'apretar start -->
            <button type="reset" class="ocult"> Clean </button>
            <button class="ocult"> Pause </button> <!-- ha de canviar a reanudar -->
        </section>
    </section>
</body>
</html>
